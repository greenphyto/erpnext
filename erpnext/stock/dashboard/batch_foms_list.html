{% for d in data %}
	<tr>
		<td>{{d.batch_no}}</td>
		<td>{{d.foms_exp}}</td>
		<td>{{d.foms_qty}}</td>
		<td>{{d.erp_exp}}</td>
		<td>{{d.erp_qty}}</td>
		<td>
			<button style="margin-left: 7px;" class="btn btn-default btn-xs btn-add" batch-no="{{d.batch_no}}">
				Update FOMS
			</button>
			<button style="margin-left: 7px;" class="btn btn-default btn-xs btn-add" batch-no="{{d.batch_no}}">
				Update ERP
			</button>
		</td>
	</tr>
{% endfor %}
